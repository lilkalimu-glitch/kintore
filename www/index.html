<!doctype html>
<html lang="de" data-theme="dunkel" data-calm data-jp="aus">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0E0F13">
  <meta name="color-scheme" content="dark">
  <title>KINTORE</title>
  <script>
    // Zuletzt gewähltes Design sofort setzen, damit beim Start nichts kurz im falschen Design aufblitzt (theme.js).
    try {
      var d = (localStorage.getItem('kintore:design') || '').split('|');
      if (d[0] === 'hell' || d[0] === 'neon') {
        document.documentElement.dataset.theme = d[0];
        if (d[0] === 'neon') document.documentElement.removeAttribute('data-calm');
      }
      if (d[1] === 'an') document.documentElement.dataset.jp = 'an';
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/ruhig.css">
  <script src="vendor/capacitor.js"></script>
  <script src="vendor/plugins.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="bg" aria-hidden="true"></div>
  <main id="view"></main>
  <div id="timer" role="timer" aria-live="off" hidden></div>
  <nav id="tabs" aria-label="Hauptmenü"></nav>
  <div id="sheet-root"></div>
  <div id="fx-root"></div>
  <div id="toast-root" aria-live="polite"></div>
</body>
</html>
